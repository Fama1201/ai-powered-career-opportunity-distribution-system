name: Jobify CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
    tags: [ "v*" ] # Triggers release only if a tag like v1.0 is pushed
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # ------------------------------------------------------------------
  # JOB 1: BUILD, TEST, QUALITY & DOCS
  # Unified for efficiency. If this fails, nothing else runs.
  # ------------------------------------------------------------------
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    # Database service so Spring Boot doesn't fail during test startup
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: jobify_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: ☕ Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: 🔧 Grant execute permission for gradlew
      run: chmod +x gradlew

    # COMPILATION and TESTS (Unit) step
    # Gradle 'build' runs 'assemble' and 'check' (tests)
    - name: 🔨 Build with Gradle
      env:
        # Passing dummy environment variables so tests load the context correctly
        DB_URL: jdbc:postgresql://localhost:5432/jobify_db
        DB_USER: postgres
        DB_PASSWORD: password123
        DISCORD_TOKEN: "DUMMY_TOKEN_FOR_CI"
        OPENAI_API_KEY: "DUMMY_KEY_FOR_CI"
      run: ./gradlew build --no-daemon

    # DOCUMENTATION step (JavaDoc)
    - name: 📚 Generate JavaDoc
      run: ./gradlew javadoc --no-daemon

    # BASIC SECURITY step (Dependencies)
    # Generates a dependency report to verify there are no conflicts
    - name: 🛡️ Check Dependencies
      run: ./gradlew dependencies --no-daemon

    # 📤 UPLOAD ARTIFACTS (Evidence for the instructor)
    
    # 1. Executable JAR (App)
    - name: 📦 Upload JAR Artifact
      uses: actions/upload-artifact@v4
      with:
        name: jobify-backend-jar
        path: build/libs/*.jar
        retention-days: 5

    # 2. Documentation (Docs)
    - name: 📄 Upload JavaDoc
      uses: actions/upload-artifact@v4
      with:
        name: jobify-javadoc
        path: build/docs/javadoc
        retention-days: 5

    # 3. Test Report (Quality)
    - name: 🧪 Upload Test Report
      if: always() # Upload report even if tests fail
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: build/test-results/test

  # ------------------------------------------------------------------
  # JOB 2: RELEASE
  # Only runs if build passed AND it is a Tag (v1.0, v2.0, etc.)
  # ------------------------------------------------------------------
  release:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write # Permission to create releases

    steps:
      - name: 📥 Download JAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: jobify-backend-jar
          path: ./release-assets

      - name: 🚀 Publish GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: ./release-assets/*.jar
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
