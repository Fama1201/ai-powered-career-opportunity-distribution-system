name: Jobify CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    # 👇 ESTA ES LA CLAVE: Definimos dónde ejecutar los comandos
    defaults:
      run:
        working-directory: ./discord-ai-bot-java

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: jobify_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: ☕ Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: 🔧 Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: 🔨 Build with Gradle
      env:
        DB_URL: jdbc:postgresql://localhost:5432/jobify_db
        DB_USER: postgres
        DB_PASSWORD: password123
        DISCORD_TOKEN: "DUMMY_TOKEN_FOR_CI"
        OPENAI_API_KEY: "DUMMY_KEY_FOR_CI"
      run: ./gradlew build --no-daemon

    - name: 📚 Generate JavaDoc
      run: ./gradlew javadoc --no-daemon

    - name: 🛡️ Check Dependencies
      run: ./gradlew dependencies --no-daemon

    # 📤 ARTIFACTS (Paths ajustados a la subcarpeta)
    - name: 📦 Upload JAR Artifact
      uses: actions/upload-artifact@v4
      with:
        name: jobify-backend-jar
        # Busca el jar dentro de la subcarpeta build/libs
        path: discord-ai-bot-java/build/libs/*.jar
        retention-days: 5

    - name: 📄 Upload JavaDoc
      uses: actions/upload-artifact@v4
      with:
        name: jobify-javadoc
        path: discord-ai-bot-java/build/docs/javadoc
        retention-days: 5

    - name: 🧪 Upload Test Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: discord-ai-bot-java/build/test-results/test

  release:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: 📥 Download JAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: jobify-backend-jar
          path: ./release-assets

      - name: 🚀 Publish GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: ./release-assets/*.jar
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
